name = "luma-backend"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "luma-db"
database_id = "luma-db-id-placeholder"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "development"
DEFAULT_LEAD_TIME_MINUTES = "10"
GEMINI_MODEL = "gemini-1.5-flash"

# Secrets to configure via `wrangler secret put <KEY>`:
# - GEMINI_API_KEY
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - PASSCODE
