name = "deepwork-backend"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "deepwork-db"
# Provision remote database: npx wrangler d1 create deepwork-db
# Paste the resulting UUID into database_id before 'wrangler deploy'
database_id = "a9b0b7f6-3fd5-43af-a522-28a9b1b651e1"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "development"
DEFAULT_LEAD_TIME_MINUTES = "5"
GEMINI_MODEL = "gemini-1.5-flash"
ALLOWED_ORIGIN = "*"

# Required Secrets to configure via `npx wrangler secret put <KEY>`:
# - PASSCODE (Required for production authentication)
# - GEMINI_API_KEY (Google AI Studio Gemini key)
# - TELEGRAM_BOT_TOKEN (Telegram Bot Token)
# - TELEGRAM_CHAT_ID (Telegram Chat ID)
